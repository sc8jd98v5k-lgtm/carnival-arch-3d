<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arch 3D — AI Generated from Photo</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a18; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 320px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Carnival Arch</b> — AI 3D from your photo<br>
  Drag to orbit · Scroll to zoom
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1526);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3, 2.5, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xfff2dd, 1.0);
dir.position.set(5, 10, 8);
scene.add(dir);
const fill = new THREE.DirectionalLight(0xaabbdd, 0.4);
fill.position.set(-5, 5, -5);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(10, 48),
  new THREE.MeshStandardMaterial({ color: 0x1a2e12, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1;
scene.add(ground);

// Load the AI-generated OBJ
const loader = new OBJLoader();
loader.load('arch_masked_0.obj', (obj) => {
  // Center and scale
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 4 / maxDim;
  
  obj.position.sub(center.multiplyScalar(scale));
  obj.scale.setScalar(scale);
  obj.position.y += 1;
  
  // Enhance materials for vertex colors
  obj.traverse((child) => {
    if (child.isMesh) {
      child.material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.8,
        metalness: 0.1
      });
    }
  });
  
  scene.add(obj);
  document.getElementById('info').innerHTML += '<br><span style="color:#7f7">✓ Model loaded</span>';
}, undefined, (err) => {
  document.getElementById('info').innerHTML += '<br><span style="color:#f77">✗ Load error</span>';
  console.error(err);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
