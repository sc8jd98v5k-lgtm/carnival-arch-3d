<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival Entrance Arch — 3D Sample</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a1a; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 300px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Carnival Entrance Arch</b> — 3D sample from reference photo<br>
  Drag to orbit · Scroll to zoom · Right-drag to pan
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1526);
scene.fog = new THREE.Fog(0x0d1526, 25, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(7, 4, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.update();

// Lights
scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const moon = new THREE.DirectionalLight(0xaabbdd, 0.4);
moon.position.set(-8, 12, 6);
scene.add(moon);
const warm = new THREE.PointLight(0xffd9a0, 60, 20);
warm.position.set(0, 5, 3);
scene.add(warm);

// Ground (grass)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 48),
  new THREE.MeshStandardMaterial({ color: 0x2d4a1e, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Stripe texture generator (red/white vertical)
function stripeTexture(colorA, colorB, stripes) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  const w = c.width / stripes;
  for (let i = 0; i < stripes; i++) {
    x.fillStyle = i % 2 ? colorA : colorB;
    x.fillRect(i*w, 0, w+1, c.height);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const redWhite = stripeTexture('#c62f45', '#f5f0e6', 12);

// Materials
const pillarMat = new THREE.MeshStandardMaterial({ map: redWhite, roughness: 0.85 });
const redMat = new THREE.MeshStandardMaterial({ color: 0xb02030, roughness: 0.8 });
const creamMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.85 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4a017, roughness: 0.4, metalness: 0.6 });
const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe9b0 });
const curtainMat = new THREE.MeshStandardMaterial({ color: 0xa01828, roughness: 0.95, side: THREE.DoubleSide });

const arch = new THREE.Group();
const W = 5.2, H = 4.2; // opening width/height

// Two striped pillars
for (const sx of [-1, 1]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(1.1, H, 1.1), pillarMat);
  p.position.set(sx * (W/2 + 0.55), H/2, 0);
  p.castShadow = true;
  arch.add(p);
  // Base
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.4), redMat);
  b.position.set(sx * (W/2 + 0.55), 0.25, 0);
  arch.add(b);
  // Capital
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.3, 1.3), goldMat);
  cap.position.set(sx * (W/2 + 0.55), H + 0.15, 0);
  arch.add(cap);
}

// Peaked striped roof (two slanted panels)
const roofH = 2.2, roofW = W + 2.4;
for (const sx of [-1, 1]) {
  const panel = new THREE.Mesh(new THREE.BoxGeometry(roofW/2 + 0.3, 0.12, 2.2), pillarMat);
  panel.position.set(sx * roofW/4, H + roofH/2, 0);
  panel.rotation.z = -sx * Math.atan2(roofH, roofW/2);
  panel.castShadow = true;
  arch.add(panel);
}
// Roof trim
const trim = new THREE.Mesh(new THREE.BoxGeometry(roofW + 0.4, 0.18, 2.4), redMat);
trim.position.set(0, H + 0.05, 0);
arch.add(trim);

// Flag on peak
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.0), goldMat);
pole.position.set(0, H + roofH + 0.5, 0);
arch.add(pole);
const flagShape = new THREE.Shape();
flagShape.moveTo(0, 0); flagShape.lineTo(0.7, 0.15); flagShape.lineTo(0, 0.35); flagShape.lineTo(0, 0);
const flag = new THREE.Mesh(new THREE.ShapeGeometry(flagShape), redMat);
flag.position.set(0.03, H + roofH + 0.65, 0);
flag.material.side = THREE.DoubleSide;
arch.add(flag);

// Marquee bulb frame around opening
const bulbGeo = new THREE.SphereGeometry(0.07, 10, 8);
function bulbRow(x0, y0, x1, y1, n) {
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const b = new THREE.Mesh(bulbGeo, bulbMat);
    b.position.set(x0 + (x1-x0)*t, y0 + (y1-y0)*t, 1.15);
    arch.add(b);
    const b2 = b.clone(); b2.position.z = -1.15; arch.add(b2);
  }
}
// Vertical rows
bulbRow(-W/2, 0.3, -W/2, H, 12);
bulbRow(W/2, 0.3, W/2, H, 12);
// Top arch row (slight curve)
for (let i = 0; i <= 16; i++) {
  const t = i / 16;
  const x = -W/2 + W * t;
  const y = H + 0.35 * Math.sin(Math.PI * t);
  for (const z of [1.15, -1.15]) {
    const b = new THREE.Mesh(bulbGeo, bulbMat);
    b.position.set(x, y, z);
    arch.add(b);
  }
}
// Bulb backing strips
const stripMat = new THREE.MeshStandardMaterial({ color: 0x5a1a1a, roughness: 0.9 });
for (const sx of [-1, 1]) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.18, H, 0.1), stripMat);
  s.position.set(sx * W/2, H/2, 1.15);
  arch.add(s);
  const s2 = s.clone(); s2.position.z = -1.15; arch.add(s2);
}

// Scalloped valance under roof
for (let i = 0; i < 12; i++) {
  const t = i / 11;
  const x = -W/2 + W * t;
  const sc = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8, 0, Math.PI*2, 0, Math.PI/2), redMat);
  sc.position.set(x, H - 0.05, 1.12);
  sc.rotation.x = Math.PI;
  arch.add(sc);
}

// Red curtains (tied back)
for (const sx of [-1, 1]) {
  const cur = new THREE.Mesh(new THREE.PlaneGeometry(1.0, H - 0.6, 6, 8), curtainMat);
  const pos = cur.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const wave = Math.sin(y * 3) * 0.08;
    pos.setX(i, pos.getX(i) + wave);
  }
  cur.geometry.computeVertexNormals();
  cur.position.set(sx * (W/2 - 0.5), (H-0.6)/2 + 0.3, 0.9);
  cur.rotation.y = -sx * 0.25;
  arch.add(cur);
}

// CARNIVAL sign (center top)
const signCanvas = document.createElement('canvas');
signCanvas.width = 512; signCanvas.height = 160;
const sx2 = signCanvas.getContext('2d');
sx2.fillStyle = '#7a1a1a'; sx2.fillRect(0, 0, 512, 160);
sx2.strokeStyle = '#d4a017'; sx2.lineWidth = 10; sx2.strokeRect(8, 8, 496, 144);
sx2.fillStyle = '#ffd54a'; sx2.font = 'bold 72px Georgia, serif';
sx2.textAlign = 'center'; sx2.textBaseline = 'middle';
sx2.fillText('CARNIVAL', 256, 84);
const signTex = new THREE.CanvasTexture(signCanvas);
const sign = new THREE.Mesh(
  new THREE.BoxGeometry(2.6, 0.8, 0.12),
  new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.6 })
);
sign.position.set(0, H + 0.9, 1.05);
arch.add(sign);
// Sign decorative top
const signTop = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 0.4, 3), goldMat);
signTop.position.set(0, H + 1.5, 1.05);
arch.add(signTop);

scene.add(arch);

// Side turrets (small striped towers)
for (const sx of [-1, 1]) {
  const tx = sx * (W/2 + 2.2);
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 2.6, 12), pillarMat);
  tower.position.set(tx, 1.3, -0.5);
  tower.castShadow = true;
  scene.add(tower);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.0, 12), pillarMat);
  cone.position.set(tx, 3.1, -0.5);
  scene.add(cone);
  const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.3, 12), redMat);
  tb.position.set(tx, 0.15, -0.5);
  scene.add(tb);
}

// String lights in background
const lightPts = [];
for (let s = 0; s < 5; s++) {
  const z = -4 - s * 3;
  const pts = [];
  for (let i = 0; i <= 20; i++) {
    const x = -10 + 20 * (i/20);
    const y = 6 - Math.sin((i/20) * Math.PI) * 1.2;
    pts.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 32, 0.015, 6),
    new THREE.MeshBasicMaterial({ color: 0x333333 })
  );
  scene.add(tube);
  for (let i = 0; i <= 20; i += 2) {
    const p = curve.getPoint(i/20);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), bulbMat);
    b.position.copy(p); b.position.y -= 0.1;
    scene.add(b);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
