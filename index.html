<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival Arch — Organic 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a18; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 320px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Carnival Arch</b> — sculpted from your photo<br>
  No clean primitives · Organic forms<br>
  Drag to orbit · Scroll to zoom
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 7;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

const scene = new THREE.Scene();
// Warm night sky — like the photo: deep blue with ambient glow, not pitch black
scene.background = new THREE.Color(0x1a2340);
scene.fog = new THREE.Fog(0x1a2340, 35, 80);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6, 4.5, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.update();

scene.add(new THREE.AmbientLight(0x9aa0c0, 0.75));
const moon = new THREE.DirectionalLight(0xbbccdd, 0.5);
moon.position.set(-8, 14, 6);
scene.add(moon);
const warmKey = new THREE.PointLight(0xffd9a0, 100, 30);
warmKey.position.set(0, 6, 5);
scene.add(warmKey);
// Soft fill from behind for depth
const backFill = new THREE.PointLight(0x88a0ff, 25, 30);
backFill.position.set(0, 8, -10);
scene.add(backFill);

// Stars in the night sky
{
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 400; i++) {
    const theta = rand() * Math.PI * 2;
    const phi = rand() * Math.PI * 0.45;
    const r = 60;
    starPos.push(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi) * 0.6 + 8,
      r * Math.sin(phi) * Math.sin(theta)
    );
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 0.35, transparent: true, opacity: 0.8 }));
  scene.add(stars);
  // Moon glow
  const moonGlow = new THREE.Mesh(
    new THREE.CircleGeometry(2.2, 32),
    new THREE.MeshBasicMaterial({ color: 0xe8eeff, transparent: true, opacity: 0.9 })
  );
  moonGlow.position.set(-18, 22, -35);
  moonGlow.lookAt(camera.position);
  scene.add(moonGlow);
  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(4.5, 32),
    new THREE.MeshBasicMaterial({ color: 0xaabbdd, transparent: true, opacity: 0.18 })
  );
  halo.position.set(-18, 22, -35.1);
  halo.lookAt(camera.position);
  scene.add(halo);
}

{
  const g = new THREE.CircleGeometry(25, 64);
  const pos = g.attributes.position;
  const colors = [];
  const c1 = new THREE.Color(0x2a4419), c2 = new THREE.Color(0x1e3312);
  for (let i = 0; i < pos.count; i++) {
    const c = c1.clone().lerp(c2, rand());
    colors.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
}

function fabricTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  const stripes = 10, sw = c.width / stripes;
  for (let s = 0; s < stripes; s++) {
    const isRed = s % 2 === 0;
    x.beginPath();
    x.moveTo(s * sw, 0);
    for (let y = 0; y <= c.height; y += 16) x.lineTo(s * sw + Math.sin(y * 0.02 + s) * 4, y);
    for (let y = c.height; y >= 0; y -= 16) x.lineTo((s+1) * sw + Math.sin(y * 0.02 + s + 1) * 4, y);
    x.closePath();
    const v = (rand() - 0.5) * 12;
    x.fillStyle = isRed ? `rgb(${178+v},${32+v*0.5},${48+v*0.5})` : `rgb(${238+v},${230+v},${218+v})`;
    x.fill();
    for (let i = 0; i < 300; i++) {
      x.fillStyle = `rgba(0,0,0,${rand() * 0.04})`;
      x.fillRect(s * sw + rand() * sw, rand() * c.height, 1.5, 1.5);
    }
  }
  for (let i = 0; i < 40; i++) {
    const gx = rand() * c.width;
    const grad = x.createLinearGradient(gx, 0, gx + 20, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, `rgba(0,0,0,${0.03 + rand() * 0.05})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad;
    x.fillRect(gx, 0, 20, c.height);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const fabricTex = fabricTexture();

function organic(geo, amp) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i, pos.getX(i)+(rand()-0.5)*amp, pos.getY(i)+(rand()-0.5)*amp, pos.getZ(i)+(rand()-0.5)*amp);
  }
  geo.computeVertexNormals();
  return geo;
}

const fabricMat = new THREE.MeshStandardMaterial({ map: fabricTex, roughness: 0.9, side: THREE.DoubleSide });
const redFabricMat = new THREE.MeshStandardMaterial({ color: 0xa02030, roughness: 0.95, side: THREE.DoubleSide });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xc9982a, roughness: 0.45, metalness: 0.55 });
const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x4a2c1a, roughness: 0.85 });

const arch = new THREE.Group();
const W = 5.4, H = 4.4;

for (const sx of [-1, 1]) {
  const px = sx * (W/2 + 0.6);
  const colGeo = new THREE.CylinderGeometry(0.52, 0.62, H, 18, 12);
  const pos = colGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), t = (y + H/2) / H;
    const bulge = 1 + Math.sin(t * Math.PI) * 0.06;
    const ang = Math.atan2(pos.getZ(i), pos.getX(i));
    const wrinkle = 1 + Math.sin(ang * 7 + t * 9) * 0.025;
    pos.setX(i, pos.getX(i) * bulge * wrinkle);
    pos.setZ(i, pos.getZ(i) * bulge * wrinkle);
  }
  colGeo.computeVertexNormals();
  const col = new THREE.Mesh(colGeo, fabricMat);
  col.position.set(px, H/2, 0);
  col.castShadow = true;
  arch.add(col);
  const baseGeo = new THREE.CylinderGeometry(0.75, 0.85, 0.55, 14, 3);
  organic(baseGeo, 0.06);
  const base = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0x8a1e2a, roughness: 0.9 }));
  base.position.set(px, 0.27, 0);
  arch.add(base);
  const capGeo = new THREE.TorusGeometry(0.58, 0.09, 10, 20);
  organic(capGeo, 0.015);
  const cap = new THREE.Mesh(capGeo, goldMat);
  cap.rotation.x = Math.PI/2;
  cap.position.set(px, H + 0.02, 0);
  arch.add(cap);
}

{
  const segs = 40, roofW = W + 2.6, roofH = 2.3;
  const geo = new THREE.PlaneGeometry(roofW, 3.2, segs, 12);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const ax = Math.abs(x) / (roofW/2);
    let h = roofH * (1 - ax);
    h -= Math.sin(ax * Math.PI) * 0.18;
    h += Math.sin(x * 2.1) * 0.03;
    pos.setXYZ(i, x, h, y);
  }
  geo.computeVertexNormals();
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 3, uv.getY(i));
  const roof = new THREE.Mesh(geo, fabricMat);
  roof.position.set(0, H + 0.1, 0);
  roof.castShadow = true;
  arch.add(roof);
  const trimGeo = new THREE.PlaneGeometry(roofW + 0.3, 0.35, 60, 4);
  const tp = trimGeo.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    tp.setY(i, tp.getY(i) + Math.sin(tp.getX(i) * 3.5) * 0.06);
    tp.setZ(i, Math.sin(tp.getX(i) * 7) * 0.02);
  }
  trimGeo.computeVertexNormals();
  const trim = new THREE.Mesh(trimGeo, redFabricMat);
  trim.position.set(0, H + 0.05, 1.62);
  arch.add(trim);
}

{
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 1.1, 8), darkWoodMat);
  pole.position.set(0, H + 2.3 + 0.55, 0);
  arch.add(pole);
  const flagGeo = new THREE.PlaneGeometry(0.75, 0.4, 12, 6);
  const fp = flagGeo.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    const t = (fp.getX(i) + 0.375) / 0.75;
    fp.setZ(i, Math.sin(t * 5) * 0.09 * t);
  }
  flagGeo.computeVertexNormals();
  const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({ color: 0xc03040, roughness: 0.9, side: THREE.DoubleSide }));
  flag.position.set(0.4, H + 2.3 + 0.85, 0);
  arch.add(flag);
}

{
  const bulbGeo = new THREE.SphereGeometry(0.065, 10, 8);
  organic(bulbGeo, 0.008);
  const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe6a8 });
  const socketMat = new THREE.MeshStandardMaterial({ color: 0x3a2020, roughness: 0.8 });
  function bulb(x, y, z) {
    const b = new THREE.Mesh(bulbGeo, bulbMat);
    b.position.set(x + (rand()-0.5)*0.015, y + (rand()-0.5)*0.015, z + (z > 0 ? 0.05 : -0.05));
    arch.add(b);
    const glow = new THREE.PointLight(0xffc86e, 2.5, 2.2);
    glow.position.copy(b.position);
    arch.add(glow);
  }
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 11; i++) {
      const t = i / 10, y = 0.4 + t * (H - 0.5);
      const wob = Math.sin(t * 9) * 0.02;
      for (const z of [0.68, -0.68]) bulb(sx * (W/2 + wob), y, z);
    }
  }
  for (let i = 0; i <= 15; i++) {
    const t = i / 15, x = -W/2 + W * t;
    const y = H + 0.12 + Math.sin(t * Math.PI) * 0.3;
    for (const z of [0.68, -0.68]) bulb(x, y, z);
  }
}

for (const sx of [-1, 1]) {
  const geo = new THREE.PlaneGeometry(1.15, H - 0.5, 16, 20);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const vT = (y + (H-0.5)/2) / (H - 0.5);
    const hT = (x + 0.575) / 1.15;
    const fold = Math.sin(hT * Math.PI * 5 + vT * 2) * 0.14 * (1 - vT * 0.4);
    const billow = Math.sin(vT * Math.PI) * 0.1;
    pos.setZ(i, fold + billow);
    pos.setX(i, x * (1 - vT * 0.25));
  }
  geo.computeVertexNormals();
  const cur = new THREE.Mesh(geo, redFabricMat);
  cur.position.set(sx * (W/2 - 0.45), (H - 0.5)/2 + 0.25, 0.45);
  cur.rotation.y = -sx * 0.35;
  cur.castShadow = true;
  arch.add(cur);
}

{
  const c = document.createElement('canvas');
  c.width = 512; c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#6e1f1f'; x.fillRect(0, 0, 512, 180);
  for (let i = 0; i < 60; i++) {
    x.strokeStyle = `rgba(0,0,0,${0.05 + rand() * 0.08})`;
    x.lineWidth = 1 + rand() * 2;
    x.beginPath();
    const yy = rand() * 180;
    x.moveTo(0, yy);
    x.bezierCurveTo(170, yy + (rand()-0.5)*20, 340, yy + (rand()-0.5)*20, 512, yy);
    x.stroke();
  }
  x.strokeStyle = '#d4a017'; x.lineWidth = 8; x.strokeRect(10, 10, 492, 160);
  x.fillStyle = '#ffd54a'; x.font = 'bold 64px Georgia, serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('CARNIVAL', 256, 92);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const boardGeo = new THREE.BoxGeometry(2.7, 0.95, 0.09, 8, 4, 1);
  organic(boardGeo, 0.02);
  const sign = new THREE.Mesh(boardGeo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 }));
  sign.position.set(0, H + 0.75, 0.72);
  arch.add(sign);
}

scene.add(arch);

for (const sx of [-1, 1]) {
  const tx = sx * (W/2 + 2.4);
  const turret = new THREE.Group();
  const bodyGeo = new THREE.CylinderGeometry(0.5, 0.62, 2.4, 16, 8);
  organic(bodyGeo, 0.03);
  const body = new THREE.Mesh(bodyGeo, fabricMat);
  body.position.y = 1.2; body.castShadow = true;
  turret.add(body);
  const coneGeo = new THREE.ConeGeometry(0.72, 1.1, 16, 6);
  organic(coneGeo, 0.03);
  const cone = new THREE.Mesh(coneGeo, fabricMat);
  cone.position.y = 2.95;
  turret.add(cone);
  turret.position.set(tx, 0, -0.8);
  scene.add(turret);
}

{
  const bulbGeo = new THREE.SphereGeometry(0.05, 8, 6);
  const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffdf9e });
  for (let s = 0; s < 4; s++) {
    const z = -5 - s * 3.5, pts = [];
    for (let i = 0; i <= 24; i++) {
      const x = -12 + 24 * (i/24);
      pts.push(new THREE.Vector3(x, 6.5 - Math.abs(Math.sin((i/24) * Math.PI * 3)) * 0.9, z));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.012, 5), new THREE.MeshBasicMaterial({ color: 0x222222 })));
    for (let i = 0; i <= 24; i += 2) {
      const p = curve.getPoint(i/24);
      const b = new THREE.Mesh(bulbGeo, bulbMat);
      b.position.set(p.x, p.y - 0.09, p.z);
      scene.add(b);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
